name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Fuseau du runner, et donc de `now` dans les gabarits Hugo.
#
# ⚠️ `timeZone = 'Pacific/Noumea'` dans hugo.toml ne suffit PAS : ce réglage sert à
# interpréter les dates SANS décalage écrites dans le front-matter, il ne change pas
# `now`, qui suit l'horloge du runner. Constaté le 21/09/2026 : `genere_le` sortait en
# `+00:00` dans /offres.json comme dans /app-v1.json, alors que le commentaire de
# hugo.toml affirmait le contraire.
#
# Conséquence concrète : la comparaison `date_cloture < aujourd'hui` qui décide de
# l'ouverture d'une offre se faisait sur la date UTC. UTC ayant onze heures de retard
# sur Nouméa, une offre clôturée hier restait listée comme ouverte jusqu'à 11 h du
# matin, heure locale.
env:
  TZ: Pacific/Noumea

# Le moteur commite une fiche par AVP, en rafale après le fetcher de 23h : les builds
# s'empilent. Le dernier gagne toujours (le site est reconstruit en entier), donc on
# annule les builds en cours plutôt que de saturer la limite de GitHub Pages (~10/h).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # ⚠️ `fetch-depth: 0` est OBLIGATOIRE, pas une commodité : `enableGitInfo`
          # (hugo.toml) tire la date de modification de chaque fiche du dernier commit
          # qui l'a touchée. Un checkout superficiel viderait ces dates SANS erreur —
          # le site se construirait, et le <lastmod> du sitemap retomberait sur la date
          # de parution. L'étape « Vérifier que les dates de modification
          # viennent bien de git », plus bas, rend la panne visible.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: |
          mkdir -p data
          echo "hash: $(git rev-parse --short HEAD)" > data/git_commit.yaml
          python3 scripts/enrich_descriptions.py
          python3 scripts/enrich_themes.py
          hugo --minify

      # `enableGitInfo` échoue en SILENCE sur un checkout superficiel : Hugo n'avertit
      # pas, il retombe simplement sur la date de parution. Le sitemap resterait valide
      # et Google se verrait dire, comme avant le 22/09/2026, que rien ne change jamais.
      #
      # Signature de la panne : les dates de parution sont des dates nues, donc rendues
      # à minuit pile. Une date de commit à minuit à la seconde près est un accident ;
      # 170 d'affilée n'en est pas un.
      - name: Vérifier que les dates de modification viennent bien de git
        run: |
          total=$(grep -c '<lastmod>' public/jobs-sitemap.xml)
          minuit=$(grep -o '<lastmod>[^<]*</lastmod>' public/jobs-sitemap.xml \
                   | grep -c 'T00:00:00' || true)
          echo "jobs-sitemap.xml : $total dates, dont $minuit à minuit pile."
          if [ "$total" -gt 0 ] && [ "$total" -eq "$minuit" ]; then
            echo "::error::Toutes les dates de modification sont à minuit : enableGitInfo" \
                 "n'a pas vu l'historique. Vérifier 'fetch-depth: 0' sur le checkout."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # --------------------------------------------------------------------------
  # Contrôle des liens et du formatage.
  #
  # Motif : le lien du logo a pointé vers /odata-avps (404) sans qu'aucun signal ne le
  # remonte, et des URL contenant %20 passent le build sans broncher.
  #
  # ⚠️ Ce job NE CONDITIONNE PAS la publication, et c'est délibéré. Le moteur pousse une
  # fiche par AVP en rafale chaque nuit : bloquer la mise en ligne de toutes les offres
  # sur un contrôle de liens ferait courir plus de risque au service qu'il n'en évite.
  # Un échec rend le run rouge — donc visible et notifié — pendant que le site part.
  # C'est un écart assumé par rapport à l'issue #6, qui demandait les liens internes
  # bloquants.
  liens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # ⚠️ `fetch-depth: 0` est OBLIGATOIRE, pas une commodité : `enableGitInfo`
          # (hugo.toml) tire la date de modification de chaque fiche du dernier commit
          # qui l'a touchée. Un checkout superficiel viderait ces dates SANS erreur —
          # le site se construirait, et le <lastmod> du sitemap retomberait sur la date
          # de parution. Ce job ne fait que vérifier des liens : il ne sert pas le
          # site, mais il doit se construire comme lui pour que les liens contrôlés
          # soient les vrais. Le garde-fou est dans le job « build ».
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: |
          mkdir -p data
          echo "hash: $(git rev-parse --short HEAD)" > data/git_commit.yaml
          python3 scripts/enrich_descriptions.py
          python3 scripts/enrich_themes.py
          hugo --minify

      # Le HTML publié est minifié : un grep sur les sources ne dit rien de ce qui est
      # réellement servi. On contrôle donc `public/`, pas `layouts/`.
      - name: Liens internes (bloquant pour ce job)
        uses: lycheeverse/lychee-action@v2
        with:
          # `--offline` ne touche pas au réseau : il ne vérifie que l'existence des
          # fichiers visés. Aucun faux positif dû à un site tiers indisponible.
          #
          # Les adresses des pages de tags sont POURCENT-ENCODÉES
          # (`/communes/noum%C3%A9a/`) alors que les dossiers sur le disque portent les
          # accents. Un vérificateur qui ne décode pas l'URL avant de chercher le fichier
          # signale environ 5 800 faux liens morts — constaté en écrivant ce contrôle
          # avec un script maison. Vérifié le 20/09/2026 sur lychee 0.24.2 : il décode,
          # et sort zéro erreur sur les pages accentuées. Si une montée de version fait
          # réapparaître des `%C3` en rouge, c'est ce défaut-là qui revient, pas une
          # régression du site.
          # 91 liens sur 108 d'une page type sont RACINE-RELATIFS (`/communes/…`). Pour
          # les résoudre sur le disque il faut `--root-dir`, et non `--base` : depuis
          # lychee 0.24, `--base` n'accepte plus qu'une URL complète ou un chemin absolu,
          # et refusait donc `public` (run 35508497213, 20/09/2026). Le chemin doit être
          # ABSOLU, d'où `github.workspace` plutôt que `public`.
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/public
            --exclude-path public/vendor
            'public/**/*.html'
          fail: true
          jobSummary: true

      - name: Liens externes (avertissement)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          # Une offre sur deux pointe vers data.gouv.nc : on limite la concurrence pour
          # ne pas marteler la plateforme, et on accepte 403 et 429, que certains sites
          # renvoient à un client automatisé sans que le lien soit mort pour autant.
          args: >-
            --scheme https
            --scheme http
            --max-concurrency 4
            --timeout 20
            --retry-wait-time 5
            --accept 200,206,403,429
            --exclude-path public/vendor
            --cache
            --max-cache-age 1d
            'public/**/*.html'
          fail: true
          jobSummary: true

      # Un formateur HTML qui passe sur layouts/ déplace les espaces des actions Go et
      # casse silencieusement le rendu. `git diff -w` masque précisément ce dégât.
      - name: Espaces en tête de chaîne Go
        run: |
          if grep -rnE '\{\{ *" +[^"]' layouts/; then
            echo "::error::Une action Go commence par une chaîne à espace initial : un formateur est passé sur layouts/."
            exit 1
          fi
          echo "✅ Aucun espace parasite en tête de chaîne Go."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5