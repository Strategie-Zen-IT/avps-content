{{ partial "avp-consentement.html" . }}

<script src="{{ "vendor/easyqrcode/easy.qrcode.min.js" | relURL }}" defer></script>

<script>
  // ⌨️ Raccourci clavier Ctrl+K
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      const searchInput = document.getElementById('R-search-by') || document.querySelector('.search-by input') || document.querySelector('[data-search-input]');
      if (searchInput) { e.preventDefault(); searchInput.focus(); searchInput.select(); }
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    let touchstartX = 0;
    let touchstartY = 0;
    let touchendX = 0;
    let touchendY = 0;

    const minSwipeDistance = 90;    // Distance minimale (en px) pour déclencher le swipe
    const maxVerticalDistance = 40; // Seuil vertical max pour éviter de confondre défilement et swipe

    function checkSwipe() {
      const diffX = touchendX - touchstartX;
      const diffY = Math.abs(touchendY - touchstartY);

      // Sécurité : On s'assure que le geste est horizontal et pas un défilement vertical (scroll)
      if (Math.abs(diffX) > minSwipeDistance && diffY < maxVerticalDistance) {
        if (diffX > 0) {
          // Swipe vers la DROITE -> Page PRÉCÉDENTE
          const prevButton = document.querySelector('.topbar-button-prev a, a.nav-prev');
          if (prevButton) prevButton.click();
        } else {
          // Swipe vers la GAUCHE -> Page SUIVANTE
          const nextButton = document.querySelector('.topbar-button-next a, a.nav-next');
          if (nextButton) nextButton.click();
        }
      }
    }

    // Gestionnaires d'événements tactiles
    document.addEventListener('touchstart', e => {
      // Optionnel : Bloquer le swipe si l'utilisateur glisse sur un tableau ou un bloc de code scrollable
      if (e.target.closest('pre, code, table, .scroller')) return;

      touchstartX = e.changedTouches[0].screenX;
      touchstartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      // Même sécurité qu'au touchstart
      if (e.target.closest('pre, code, table, .scroller')) return;

      touchendX = e.changedTouches[0].screenX;
      touchendY = e.changedTouches[0].screenY;
      checkSwipe();
    }, { passive: true });
  });

  // ⏳ Badge d'échéance, sur TOUTES les pages (fiches et listes) : le site est statique,
  //    une date figée au build afficherait « Plus que 3 jours » indéfiniment.
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('.avp-urgency-badge[data-cloture]').forEach(function (badge) {
      const dateClotureStr = badge.getAttribute('data-cloture');
      if (!dateClotureStr) return;
      const cloture = new Date(dateClotureStr + 'T00:00:00');
      const now = new Date();
      cloture.setHours(0, 0, 0, 0); now.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((cloture - now) / (1000 * 60 * 60 * 24));

      let html = '<span class="badge badge-info">Candidatures ouvertes</span>';
      if (diffDays < 0) html = '<span class="badge badge-expired">Clôturé</span>';
      else if (diffDays === 0) html = '<span class="badge badge-critical">Dernier jour</span>';
      else if (diffDays === 1) html = '<span class="badge badge-critical">Clôture demain</span>';
      else if (diffDays <= 7) html = '<span class="badge badge-warning">Plus que ' + diffDays + ' jours</span>';
      badge.innerHTML = html;
    });
  });

  // 🔢 COMPTEURS D'OFFRES DANS LE MENU
  //    Le libellé des entrées de menu est rendu par un partial du thème partagé avec le
  //    fil d'Ariane et les flux : l'étendre aurait affiché le compteur partout. On
  //    l'ajoute donc après coup, à partir de /offres.json. Sans JavaScript, le menu
  //    reste parfaitement utilisable, simplement sans les nombres.
  // NB : dans un bloc <script>, Go échappe ET met déjà la valeur entre guillemets. Ne
  //      pas y ajouter de `jsonify` ni de quotes, sinon on obtient une chaîne qui
  //      contient elle-même des guillemets. Et pas d'accolades doubles en commentaire :
  //      Hugo les interprète comme une action de template.
  document.addEventListener("DOMContentLoaded", function () {
    var menu = document.getElementById('R-sidebar');
    if (!menu) return;
    fetch({{ "offres.json" | relURL }})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        var parSection = {};
        data.offres.forEach(function (o) {
          if (!o.ouverte) return;                    // le menu ne compte que l'ouvert
          // La section est le premier segment de l'adresse de l'offre.
          var seg = (o.url || '').split('/').filter(Boolean)[0];
          if (seg) parSection[seg] = (parSection[seg] || 0) + 1;
        });
        menu.querySelectorAll('li[data-nav-id] > a').forEach(function (lien) {
          var segs = (new URL(lien.href, window.location.origin)).pathname
            .replace(/\/index\.html$/, '')
            .split('/').filter(Boolean);
          if (segs.length !== 1) return;              // seules les rubriques de 1er niveau
          var n = parSection[segs[0]];
          if (!n) return;
          if (lien.querySelector('.avp-menu-compte')) return;
          var badge = document.createElement('span');
          badge.className = 'avp-menu-compte';
          badge.textContent = n;
          badge.setAttribute('aria-label', n + ' offre' + (n > 1 ? 's' : '') + ' ouverte' + (n > 1 ? 's' : ''));
          lien.appendChild(badge);
        });
      })
      .catch(function () { /* sans le JSON, le menu reste sans compteurs */ });
  });

  // 🔎 RÉSULTATS DE RECHERCHE EN CARTES
  //    Le thème rend chaque résultat en simple lien. Sur la page de recherche, on les
  //    enrichit APRÈS coup à partir de /offres.json (déjà produit au build pour la page
  //    « Toutes les offres ») : employeur, logo, commune, échéance.
  //
  //    Les résultats qui ne sont PAS des offres — pages de tags, pages éditoriales —
  //    gardaient auparavant le rendu du thème : un lien précédé d'un chevron, avec le
  //    fil d'ariane en dessous. Mélangés aux cartes, ils faisaient désordre, et rien
  //    n'indiquait qu'il s'agissait d'autre chose qu'une offre. Ils reçoivent donc la
  //    même carte, avec un badge de type à la place de la famille de métier, et un
  //    liseré neutre pour qu'on les distingue d'un coup d'œil d'une offre à pourvoir.
  document.addEventListener("DOMContentLoaded", function () {
    var conteneur = document.getElementById('R-searchresults');
    if (!conteneur) return;

    var parOffre = null;
    var enAttente = [];

    function chemin(url) {
      try {
        return new URL(url, window.location.origin).pathname
          .replace(/\/index\.html$/, '')
          .replace(/\/+$/, '');
      } catch (e) { return ''; }
    }

    function enrichir(lien) {
      if (!parOffre || lien.dataset.avpEnrichi) return;
      var offre = parOffre[chemin(lien.getAttribute('href'))];
      if (!offre) return;
      lien.dataset.avpEnrichi = '1';
      lien.classList.add('avp-resultat');
      if (!offre.ouverte) lien.classList.add('avp-resultat--close');
      lien.textContent = '';

      var entete = document.createElement('span');
      entete.className = 'avp-resultat__entete';
      if (offre.familles && offre.familles.length) {
        var fam = document.createElement('span');
        fam.className = 'avp-resultat__famille';
        fam.textContent = offre.familles[0];
        entete.appendChild(fam);
      }
      if (!offre.ouverte) {
        var clos = document.createElement('span');
        clos.className = 'badge badge-expired';
        clos.textContent = 'Clôturée';
        entete.appendChild(clos);
      }
      lien.appendChild(entete);

      var titre = document.createElement('span');
      titre.className = 'avp-resultat__titre';
      titre.textContent = offre.titre;
      lien.appendChild(titre);

      var employeur = document.createElement('span');
      employeur.className = 'avp-resultat__employeur';
      if (offre.logo) {
        var img = document.createElement('img');
        img.src = offre.logo;
        img.alt = '';
        img.loading = 'lazy';
        img.className = 'avp-resultat__logo';
        img.onerror = function () { img.remove(); };
        employeur.appendChild(img);
      }
      employeur.appendChild(document.createTextNode(offre.collectivite || 'Employeur non précisé'));
      lien.appendChild(employeur);

      var meta = document.createElement('span');
      meta.className = 'avp-resultat__meta';
      if (offre.commune) meta.appendChild(document.createTextNode(offre.commune));
      if (offre.cloture) {
        if (offre.commune) meta.appendChild(document.createTextNode(' · '));
        meta.appendChild(document.createTextNode("jusqu'au " + offre.cloture));
      }
      lien.appendChild(meta);
    }

    // Préfixes posés par i18n/fr.toml sur les pages de tags : « Collectivité : Nouméa ».
    // On les reconnaît pour en faire un badge de type et ne garder que le terme comme
    // titre. Tout le reste est une page du site.
    var TYPES = ['Famille de métier', 'Collectivité', 'Commune', 'Province',
                 'Corps ou grade', 'Direction'];

    function enrichirPage(lien) {
      if (lien.dataset.avpEnrichi) return;
      lien.dataset.avpEnrichi = '1';

      // Le thème a déjà construit le lien : on lui reprend ses trois informations
      // avant de le vider, plutôt que de les recalculer.
      var brut = (lien.querySelector('.link') || {}).innerText || lien.innerText || '';
      var extrait = (lien.querySelector('.context') || {}).innerText || '';

      var type = 'Page du site';
      var titre = brut.replace(/^»\s*/, '').trim();
      for (var i = 0; i < TYPES.length; i++) {
        if (titre.indexOf(TYPES[i] + ' : ') === 0) {
          type = TYPES[i];
          titre = titre.slice(TYPES[i].length + 3);
          break;
        }
      }

      lien.textContent = '';
      lien.classList.add('avp-resultat', 'avp-resultat--page');

      var entete = document.createElement('span');
      entete.className = 'avp-resultat__entete';
      var badge = document.createElement('span');
      badge.className = 'avp-resultat__famille';
      badge.textContent = type;
      entete.appendChild(badge);
      lien.appendChild(entete);

      var t = document.createElement('span');
      t.className = 'avp-resultat__titre';
      t.textContent = titre;
      lien.appendChild(t);

      // Pas de repli sur le fil d'ariane : il affiche le nom technique de la taxonomie
      // (« collectivites »), ce qui est précisément ce qu'on cherchait à faire
      // disparaître. Sans extrait, la carte se limite au badge et au titre, ce qui
      // suffit à savoir où l'on va.
      if (extrait) {
        var meta = document.createElement('span');
        meta.className = 'avp-resultat__meta';
        meta.textContent = extrait;
        lien.appendChild(meta);
      }
    }

    // Une entrée est une offre si son adresse figure dans /offres.json ; sinon c'est une
    // page. Les deux reçoivent une carte, la distinction se fait sur le contenu.
    function presenter(lien) {
      if (!parOffre || lien.dataset.avpEnrichi) return;
      if (parOffre[chemin(lien.getAttribute('href'))]) { enrichir(lien); }
      else { enrichirPage(lien); }
    }

    function traiter(racine) {
      var liens = racine.matches && racine.matches('a.autocomplete-suggestion')
        ? [racine]
        : Array.prototype.slice.call(racine.querySelectorAll ? racine.querySelectorAll('a.autocomplete-suggestion') : []);
      liens.forEach(function (l) {
        if (parOffre) { presenter(l); } else { enAttente.push(l); }
      });
    }

    // Les résultats arrivent de façon asynchrone, et à chaque frappe : on observe plutôt
    // que d'essayer de deviner le moment où ils sont prêts.
    new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (n) {
          if (n.nodeType === 1) traiter(n);
        });
      });
    }).observe(conteneur, { childList: true, subtree: true });

    fetch({{ "offres.json" | relURL }})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        parOffre = {};
        data.offres.forEach(function (o) { parOffre[chemin(o.url)] = o; });
        enAttente.forEach(presenter);
        enAttente = [];
        traiter(conteneur);
      })
      .catch(function () { /* sans le JSON, les résultats gardent leur rendu d'origine */ });
  });

  // 🃏 📱 AUTO-INJECTION DES QR CODES SUR LES CARTES D'AVP
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof QRCode === 'undefined') return;

    // On cible toutes les cartes d'offres de la liste
    const cards = document.querySelectorAll('.avp-list-card');

    cards.forEach(function (card, index) {
      // On cherche le lien de la fiche dans la carte (le titre h3 ou premier lien)
      const targetLink = card.querySelector('h3 a') || card.querySelector('a');
      if (!targetLink) return;

      // Création dynamique d'un conteneur pour le mini QR Code
      const qrWrapper = document.createElement('div');
      qrWrapper.className = 'avp-card-qrcode-container';

      const qrCanvasDiv = document.createElement('div');
      qrCanvasDiv.id = 'card-qr-' + index;

      qrWrapper.appendChild(qrCanvasDiv);
      card.appendChild(qrWrapper); // On l'injecte dans la carte

      // Génération du mini QR code ciblant l'URL exacte de la fiche
      new QRCode(qrCanvasDiv, {
        text: targetLink.href,
        width: 65,
        height: 65,
        colorDark: "#0F6E56",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M // Pas besoin du logo sur les petites cartes
      });

      // Ajout d'attributs d'accessibilité sur les mini QR codes générés
      setTimeout(function () {
        const qrImages = qrCanvasDiv.querySelectorAll('img, canvas');
        qrImages.forEach(function (el) {
          el.setAttribute('alt', '');
          el.setAttribute('aria-hidden', 'true');
        });
      }, 200);
    });
  });

  // ☎️ Rend les numéros de téléphone cliquables sur les fiches déjà publiées
  //    (les fiches régénérées par le pipeline contiennent déjà un lien tel:).
  document.addEventListener("DOMContentLoaded", function () {
    const NC_PHONE = /(\(?\+?\s*687\)?[\s. \-]*\d[\d\s. \-]{4,}\d)/;
    document.querySelectorAll('li, p').forEach(function (el) {
      if (el.querySelector('a[href^="tel:"]')) return;                 // déjà cliquable
      if (!/par t[ée]l[ée]phone/i.test(el.textContent)) return;        // bloc « Par téléphone »
      el.innerHTML = el.innerHTML.replace(NC_PHONE, function (num) {
        const href = num.replace(/[^\d+]/g, '');
        return '<a href="tel:' + href + '">' + num.trim() + '</a>';
      });
    });
  });
</script>
