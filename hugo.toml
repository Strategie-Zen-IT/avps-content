[outputFormats.jobs_sitemap]
  mediaType = "application/xml"
  baseName = "jobs-sitemap"
  isHTML = false

[outputFormats.flux_ats]
  mediaType = "application/xml"
  baseName = "flux_ats"
  isHTML = false

# Index JSON des offres ouvertes, produit au build. Sert à la page « Toutes les offres »
# (filtres côté client, sans dépendance externe) et aux compteurs du menu.
[outputFormats.offres]
  mediaType = "application/json"
  baseName = "offres"
  isPlainText = true
  notAlternative = true

# JSON-LD complet d'une offre, servi à côté de sa fiche : `/famille/reference/index.json`.
# C'est exactement le balisage Schema.org/JobPosting embarqué dans la page, mais en
# fichier séparé — un réutilisateur n'a plus à découper du HTML pour l'obtenir.
# N'est activé que sur les fiches d'offres, via le `cascade` de content/_index.md.
[outputFormats.avp_json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputFormats.sitemap-index]
  mediaType = "application/xml"
  baseName = "sitemap-index"
  isHTML = false

[outputs]
  home = ['html', 'rss', 'print','markdown','jobs_sitemap','flux_ats','sitemap-index','offres']
  page = ['html', 'print','markdown']
  section = ['html', 'rss', 'print','markdown']

# Pages exclues du sitemap : l'index brut des tags et la page de recherche. Elles restent
# servies et portent noindex,follow (layouts/partials/custom-header.html) : les lister
# dans le sitemap tout en demandant de ne pas les indexer était contradictoire.
[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade.target]
    path = '{/tags,/tags/**,/search,/search/**}'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # HTML brut DÉSACTIVÉ (19/09/2026). Les fiches sont écrites par le moteur à partir
      # d'un PDF lu par un modèle : le laisser actif revenait à publier tel quel le HTML
      # qui s'y glisserait. Le coût de la bascule a été nul, une seule balise existait
      # dans tout le contenu. Les shortcodes et les gabarits ne sont pas concernés :
      # leur sortie HTML passe indépendamment de ce réglage.
      unsafe = false

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
