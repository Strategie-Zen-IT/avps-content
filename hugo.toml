baseURL = 'https://avps.nc'
locale = 'fr-fr'
defaultContentLanguage = 'fr'

# Fuseau de référence du site. Sans lui, `now` vaut l'heure du serveur de build (UTC sur
# GitHub Actions), soit onze heures d'écart avec Nouméa : une offre clôturant le jour même
# aurait disparu des listes une demi-journée trop tôt.
timeZone = 'Pacific/Noumea'
title = "avps.nc — Emploi public en Nouvelle-Calédonie"
theme = 'hugo-theme-relearn'

[params]
  # Options du thème Relearn
  # Variantes de couleurs propres au site : assets/css/theme-avps-{light,dark}.css
  # (palette « lagon » vert + or, titres en serif). ⚠️ Une variante dont le CSS est
  # absent fait ÉCHOUER le build Hugo, ce n'est pas un simple avertissement.
  themeVariant = [ "avps-light", "avps-dark" ]
  landingPageName = "<i class='fa-fw fas fa-home'></i> Bienvenue"
  # Menu trié alphabétiquement : les familles de métier n'ont pas d'ordre naturel, et un
  # tri par poids les laisserait dans l'ordre d'apparition des offres.
  ordersectionsby = "title"
  collapsibleMenu = true
  disableShortcutsTitle = true
  images = ["/assets/logo-avps.svg"]

  # ⚠️ Les clés simples de [params] doivent rester AVANT le premier sous-tableau
  # ([params.editeur], [params.author]…) : en TOML, tout ce qui suit l'ouverture d'un
  # sous-tableau lui appartient. Placées après, `dataset_url` et `ga_id` se retrouvaient
  # dans `params.editeur` et étaient donc introuvables.

  # Adresse du dataset Hugging Face (HF_REPO_ID côté moteur). Vide tant qu'il n'est
  # pas créé : le lien du pied de page est alors masqué.
  dataset_url = ""

  # Mesure d'audience Google Analytics 4, chargée UNIQUEMENT après consentement explicite
  # (voir layouts/partials/avp-consentement.html). Vider cette valeur suffit à tout
  # désactiver : plus de bannière, plus de script, plus de cookie.
  ga_id = "G-M5ZZ0TTRB3"

  # Éditeur du site (affiché dans le pied de page et les mentions légales).
  [params.editeur]
    nom = "Stratégie Zen IT"
    url = "https://strategiezenit.com"
    contact = "melanie+webmaster@strategiezenit.com"

  [params.author]
    name = "Stratégie Zen IT"

# Réseaux de l'éditeur, affichés dans le pied de page de chaque offre.
# `icone` est une classe Font Awesome (livrée par le thème).
[[params.reseaux]]
  nom = "LinkedIn Stratégie Zen IT"
  url = "https://www.linkedin.com/company/strategiezenit"
  icone = "fab fa-linkedin-in"

[[params.reseaux]]
  nom = "LinkedIn Mélanie Gault"
  url = "https://www.linkedin.com/in/melaniegault/"
  icone = "fab fa-linkedin"

[[params.reseaux]]
  nom = "YouTube — Optimise ton workspace"
  url = "https://www.youtube.com/@optimisetonworkspace"
  icone = "fab fa-youtube"

[[params.reseaux]]
  nom = "Facebook — Le monde numérique de Mélanie"
  url = "https://www.facebook.com/lemondenumeriquedemelanie"
  icone = "fab fa-facebook-f"

[[params.reseaux]]
  nom = "TikTok — Mélanie numérique"
  url = "https://www.tiktok.com/discover/melanie-numerique"
  icone = "fab fa-tiktok"

[[params.reseaux]]
  nom = "Blog — Le monde numérique de Mélanie"
  url = "https://lemondenumeriquedemelanie.com"
  icone = "fas fa-blog"

# ------------------------------------------------------------------------------
# Taxonomies
#
# Un seul `tags` fourre-tout mélangeant ville, province, corps et familles rendrait
# impossible de lister « tous les AVP de la Province Sud » sans y voir aussi les corps
# et les métiers. Avec une trentaine d'employeurs, chaque axe doit être navigable seul.
#
# Deux niveaux d'employeur, distincts dans la source open data :
#   - `collectivites` : l'employeur juridique (libellecollectivite — Nouvelle-Calédonie,
#     Province Sud, Ville du Mont-Dore, Centre hospitalier territorial…)
#   - `directions`    : la direction de rattachement AU SEIN de cette collectivité
#     (libelledirection — Direction des affaires sanitaires et sociales, DITTT…),
#     complétée depuis le document quand la source ne la donne pas (17 % des cas).
#
# `familles` (41 familles RESPNC) structure content/ et le menu ; le reste est transverse.
# ------------------------------------------------------------------------------
[taxonomies]
  famille = 'familles'
  collectivite = 'collectivites'
  direction = 'directions'
  commune = 'communes'
  province = 'provinces'
  corps = 'corps'
  tag = 'tags'

# ⚠️ Une même page ne peut figurer qu'UNE fois dans le menu : déclarée à la fois en
# raccourci ici et dans l'en-tête de la barre latérale
# (layouts/partials/_relearn/defaultSidebarHeader.gotmpl), elle disparaît silencieusement
# de l'en-tête. « Toutes les offres » et « Comprendre les AVP » sont donc UNIQUEMENT dans
# l'en-tête, juste sous « Bienvenue », et n'ont pas de raccourci.

[params.topbar]
    sidebar = "show"

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-rss'></i> Être alerté"
pageRef = "/etre-alerte"
weight = 6

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-box-archive'></i> Offres clôturées"
pageRef = "/archives"
weight = 8

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-info-circle'></i> À propos"
pageRef = "/a-propos"
weight = 10

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-chart-line'></i> Statistiques"
pageRef = "/stats"
weight = 20

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-balance-scale'></i> Mentions légales"
pageRef = "/mentions-legales"
weight = 40

[outputFormats.jobs_sitemap]
  mediaType = "application/xml"
  baseName = "jobs-sitemap"
  isHTML = false

[outputFormats.flux_ats]
  mediaType = "application/xml"
  baseName = "flux_ats"
  isHTML = false

# Index JSON des offres ouvertes, produit au build. Sert à la page « Toutes les offres »
# (filtres côté client, sans dépendance externe) et aux compteurs du menu.
[outputFormats.offres]
  mediaType = "application/json"
  baseName = "offres"
  isPlainText = true
  notAlternative = true

[outputFormats.sitemap-index]
  mediaType = "application/xml"
  baseName = "sitemap-index"
  isHTML = false

[outputs]
  home = ['html', 'rss', 'print','markdown','jobs_sitemap','flux_ats','sitemap-index','offres']
  page = ['html', 'print','markdown']
  section = ['html', 'rss', 'print','markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # HTML brut DÉSACTIVÉ (19/09/2026). Les fiches sont écrites par le moteur à partir
      # d'un PDF lu par un modèle : le laisser actif revenait à publier tel quel le HTML
      # qui s'y glisserait. Le coût de la bascule a été nul, une seule balise existait
      # dans tout le contenu. Les shortcodes et les gabarits ne sont pas concernés :
      # leur sortie HTML passe indépendamment de ce réglage.
      unsafe = false

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
