baseURL = 'https://avps.nc'
locale = 'fr-fr'
defaultContentLanguage = 'fr'
title = "avps.nc — Emploi public en Nouvelle-Calédonie"
theme = 'hugo-theme-relearn'

[params]
  # Options du thème Relearn
  # Variantes de couleurs propres au site : assets/css/theme-avps-{light,dark}.css
  # (palette « lagon » vert + or, titres en serif). ⚠️ Une variante dont le CSS est
  # absent fait ÉCHOUER le build Hugo, ce n'est pas un simple avertissement.
  themeVariant = [ "avps-light", "avps-dark" ]
  landingPageName = "<i class='fa-fw fas fa-home'></i> Bienvenue"
  collapsibleMenu = true
  disableShortcutsTitle = true
  images = ["/assets/logo-avps.svg"]

  # Éditeur du site (affiché dans le pied de page et les mentions légales).
  [params.editeur]
    nom = "Stratégie Zen IT"
    url = "https://strategiezenit.com"
    contact = "melanie+webmaster@strategiezenit.com"

  # Adresse du dataset Hugging Face (HF_REPO_ID côté moteur). Vide tant qu'il n'est
  # pas créé : le lien du pied de page est alors masqué.
  dataset_url = ""

  [params.author]
    name = "Stratégie Zen IT"

# Réseaux de l'éditeur, affichés dans le pied de page de chaque offre.
# `icone` est une classe Font Awesome (livrée par le thème).
[[params.reseaux]]
  nom = "LinkedIn Stratégie Zen IT"
  url = "https://www.linkedin.com/company/strategiezenit"
  icone = "fab fa-linkedin-in"

[[params.reseaux]]
  nom = "LinkedIn Mélanie Gault"
  url = "https://www.linkedin.com/in/melaniegault/"
  icone = "fab fa-linkedin"

[[params.reseaux]]
  nom = "YouTube — Optimise ton workspace"
  url = "https://www.youtube.com/@optimisetonworkspace"
  icone = "fab fa-youtube"

[[params.reseaux]]
  nom = "Facebook — Le monde numérique de Mélanie"
  url = "https://www.facebook.com/lemondenumeriquedemelanie"
  icone = "fab fa-facebook-f"

[[params.reseaux]]
  nom = "TikTok — Mélanie numérique"
  url = "https://www.tiktok.com/discover/melanie-numerique"
  icone = "fab fa-tiktok"

[[params.reseaux]]
  nom = "Blog — Le monde numérique de Mélanie"
  url = "https://lemondenumeriquedemelanie.com"
  icone = "fas fa-blog"

# ------------------------------------------------------------------------------
# Taxonomies
#
# Un seul `tags` fourre-tout mélangeant ville, province, corps et familles rendrait
# impossible de lister « tous les AVP de la Province Sud » sans y voir aussi les corps
# et les métiers. Avec une trentaine d'employeurs, chaque axe doit être navigable seul.
#
# Deux niveaux d'employeur, distincts dans la source open data :
#   - `collectivites` : l'employeur juridique (libellecollectivite — Nouvelle-Calédonie,
#     Province Sud, Ville du Mont-Dore, Centre hospitalier territorial…)
#   - `directions`    : la direction de rattachement AU SEIN de cette collectivité
#     (libelledirection — Direction des affaires sanitaires et sociales, DITTT…),
#     complétée depuis le document quand la source ne la donne pas (17 % des cas).
#
# `familles` (41 familles RESPNC) structure content/ et le menu ; le reste est transverse.
# ------------------------------------------------------------------------------
[taxonomies]
  famille = 'familles'
  collectivite = 'collectivites'
  direction = 'directions'
  commune = 'communes'
  province = 'provinces'
  corps = 'corps'
  tag = 'tags'

[params.topbar]
    sidebar = "show"

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-info-circle'></i> À propos"
pageRef = "/a-propos"
weight = 10

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-chart-line'></i> Statistiques"
pageRef = "/stats"
weight = 20

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-code'></i> Développeurs"
pageRef = "/developpeurs"
weight = 30

[[menu.shortcuts]]
name = "<i class='fas fa-fw fa-balance-scale'></i> Mentions légales"
pageRef = "/mentions-legales"
weight = 40

[outputFormats.jobs_sitemap]
  mediaType = "application/xml"
  baseName = "jobs-sitemap"
  isHTML = false

[outputFormats.flux_ats]
  mediaType = "application/xml"
  baseName = "flux_ats"
  isHTML = false

[outputFormats.sitemap-index]
  mediaType = "application/xml"
  baseName = "sitemap-index"
  isHTML = false

[outputs]
  home = ['html', 'rss', 'print','markdown','jobs_sitemap','flux_ats','sitemap-index']
  page = ['html', 'print','markdown']
  section = ['html', 'rss', 'print','markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # Autorise le HTML brut dans le Markdown (pied de page, centrage)

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
